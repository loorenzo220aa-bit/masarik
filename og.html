<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>og</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;
    font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
    background:
      radial-gradient(700px 420px at 88% -12%, #d7f2ea 0%, transparent 62%),
      radial-gradient(560px 380px at -8% 110%, #eef2ff 0%, transparent 60%),
      #0f172a;
    color:#0f172a;position:relative}
  .grid{position:absolute;inset:0;
    background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
    background-size:56px 56px}
  .card{position:absolute;inset:44px;border:1px solid rgba(255,255,255,.14);
    border-radius:34px;background:rgba(255,255,255,.06);backdrop-filter:blur(2px);
    padding:56px 64px;display:flex;flex-direction:column;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:18px}
  .mark{width:78px;height:78px;border-radius:22px;background:#0e7c66;
    display:grid;place-items:center;font-size:40px}
  .brand b{color:#fff;font-size:44px;line-height:1.1;display:block}
  .brand span{color:#94a3b8;font-size:22px}
  h1{color:#fff;font-size:74px;line-height:1.22;font-weight:700;letter-spacing:-.02em}
  h1 em{font-style:normal;color:#5eead4}
  .chips{display:flex;gap:14px}
  .chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
    color:#e2e8f0;font-size:24px;padding:14px 28px;border-radius:99px;font-weight:600}
  .chip.wa{background:#25d366;border-color:#25d366;color:#06210f}
  .price{position:absolute;left:64px;bottom:56px;text-align:left}
  .price b{color:#5eead4;font-size:78px;line-height:1;display:block}
  .price span{color:#94a3b8;font-size:22px}
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="card">
    <div class="brand">
      <div class="mark">📄</div>
      <div><b>مسارك</b><span>سيرتك تفتح الباب</span></div>
    </div>

    <h1>سيرة ذاتية تجعلهم<br><em>يختارونك</em> — لا يتجاوزونك</h1>

    <div class="chips">
      <span class="chip wa">💬 اطلب عبر واتساب</span>
      <span class="chip">⚡ تسليم ٤٨ ساعة</span>
      <span class="chip">✅ تعديلين مجانيان</span>
      <span class="chip">🇸🇦 عربي + إنجليزي</span>
    </div>

    <div class="price"><b>١٥٠</b><span>ر.س تبدأ الباقات</span></div>
  </div>
</body>
</html>
